<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Courbes multiples — Spotify</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #1e2126;
      background: #f4f5f7;
    }
    header {
      padding: 18px 24px;
      background: #fff;
      border-bottom: 1px solid #e2e4e8;
    }
    header h1 { margin: 0; font-size: 1.3rem; }
    header p  { margin: 4px 0 0; color: #5a5f66; font-size: .9rem; }
    main { padding: 24px; }
    #courbes svg { max-width: 900px; width: 100%; height: auto; }
    .hint { color: #8b8e95; font-size: .88rem; font-style: italic; margin: 8px 0 0; }
    .toolbar { margin-bottom: 14px; font-size: .9rem; color: #5a5f66; }
    .toolbar select {
      font-size: .9rem; padding: 5px 8px; border: 1px solid #e2e4e8;
      border-radius: 8px; background: #fff; color: #1e2126;
    }
    .legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
    .legend button {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .85rem; padding: 4px 10px; border: 1px solid #e2e4e8;
      border-radius: 999px; background: #fff; color: #1e2126; cursor: pointer;
    }
    .legend button .swatch { width: 10px; height: 10px; border-radius: 50%; }
    .legend button.off { opacity: .4; }
    .legend button.off .swatch { background: #c4c7cc !important; }
    .tooltip {
      position: fixed;
      pointer-events: none;
      display: none;
      background: #fff;
      border: 1px solid #e2e4e8;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 12px;
      color: #1e2126;
      box-shadow: 0 4px 14px rgba(0,0,0,.12);
      z-index: 10;
    }
  </style>
</head>
<body>
  <header>
    <h1>Courbes multiples</h1>
    <p>Comment le son de chaque genre évolue-t-il au fil des décennies ?</p>
  </header>

  <main>
    <div class="toolbar">
      <label>Caractéristique : <select id="feature-select"></select></label>
    </div>
    <div id="legend" class="legend"></div>
    <div id="courbes"></div>
    <p class="hint">Taille d'un point = nombre de titres. Pointillés = moins de 30 titres : moyenne peu fiable.
      Clique sur un genre de la légende pour le masquer ou l'afficher.</p>
  </main>

  <div id="tip" class="tooltip"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="js/DataLoader.js"></script>
  <script src="js/courbes/courbes.js"></script>
</body>
</html>
