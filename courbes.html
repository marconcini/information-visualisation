<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Courbes multiples — Spotify</title>
  <style>
    :root {
      --bg: #ffffff; --ink: #1b1e24; --ink-soft: #5a5f66; --ink-faint: #8b9098;
      --line: #e4e5e8; --line-strong: #c9ccd1; --accent: #2f6fb0;
    }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
      --bg: #17191d; --ink: #e6e7ea; --ink-soft: #a6abb3; --ink-faint: #7a808a;
      --line: #2c3038; --line-strong: #444a55; --accent: #5b9bd8;
    }}
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    main { max-width: 960px; margin: 0 auto; padding: 20px 24px 32px; }
    h1 { margin: 0 0 4px; font-size: 1.25rem; }
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 14px 0 6px; font-size: .9rem; }
    select, button {
      font: inherit; font-size: .85rem; padding: 4px 8px;
      border: 1px solid var(--line-strong); border-radius: 4px;
      background: var(--bg); color: var(--ink); cursor: pointer;
    }
    button:disabled { opacity: .4; cursor: default; }
    .legend { display: flex; flex-wrap: wrap; gap: 6px; }
    .legend button { display: inline-flex; align-items: center; gap: 5px; }
    .legend .swatch { width: 10px; height: 10px; border-radius: 50%; }
    .legend button.off { opacity: .4; }
    .legend button.off .swatch { background: var(--line-strong) !important; }
    #courbes svg, #context svg { display: block; width: 100%; height: auto; }
    #context .selection { fill: var(--accent); fill-opacity: .15; stroke: var(--accent); }
    .hint { margin: 4px 0 0; color: var(--ink-faint); font-size: .8rem; }
    #details { margin-top: 18px; font-size: .88rem; }
    #details h2 { font-size: .95rem; margin: 0 0 6px; }
    #details ol { margin: 0; padding-left: 20px; }
    #details li { padding: 2px 0; }
    #details .meta { color: var(--ink-faint); }
    .tooltip {
      position: fixed; pointer-events: none; display: none; z-index: 10;
      background: var(--bg); border: 1px solid var(--line-strong); border-radius: 4px;
      padding: 5px 8px; font-size: 12px; color: var(--ink);
    }
  </style>
</head>
<body>
  <main>
    <h1>Évolution des genres par décennie</h1>

    <div class="toolbar">
      <label>Caractéristique : <select id="feature-select"></select></label>
      <div id="legend" class="legend"></div>
    </div>

    <div id="courbes"></div>
    <div id="context"></div>
    <p class="hint">Glisse sur la frise pour choisir une période ·
      <button id="reset-period" type="button" disabled>Toute la période</button></p>
    <p class="hint">Pointillés : moins de 30 titres (moyenne peu fiable). Clique sur un point pour voir ses titres.</p>

    <div id="details"></div>
  </main>

  <div id="tip" class="tooltip"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="js/DataLoader.js"></script>
  <script src="js/courbes/courbes.js"></script>
</body>
</html>
