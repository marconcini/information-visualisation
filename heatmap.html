<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heatmap de corrélation — Spotify</title>
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: #1e2126;
      background: #f4f5f7;
    }
    header {
      padding: 18px 24px;
      background: #fff;
      border-bottom: 1px solid #e2e4e8;
    }
    header h1 { margin: 0; font-size: 1.3rem; }
    header p  { margin: 4px 0 0; color: #5a5f66; font-size: .9rem; }
    main { padding: 24px; }
    #heatmap svg { max-width: 760px; width: 100%; height: auto; }
    .hint { color: #8b8e95; font-size: .88rem; font-style: italic; margin: 8px 0 0; }
    .toolbar { margin-bottom: 14px; font-size: .9rem; color: #5a5f66; }
    .toolbar select {
      font-size: .9rem; padding: 5px 8px; border: 1px solid #e2e4e8;
      border-radius: 8px; background: #fff; color: #1e2126;
    }
    .tooltip {
      position: fixed;
      pointer-events: none;
      display: none;
      background: #fff;
      border: 1px solid #e2e4e8;
      border-radius: 6px;
      padding: 6px 9px;
      font-size: 12px;
      color: #1e2126;
      box-shadow: 0 4px 14px rgba(0,0,0,.12);
      z-index: 10;
    }
  </style>
</head>
<body>
  <header>
    <h1>Heatmap de corrélation</h1>
    <p>Quelles caractéristiques audio vont ensemble ? (corrélation de Pearson)</p>
  </header>

  <main>
    <div class="toolbar">
      <label>Genre : <select id="genre-filter"></select></label>
    </div>
    <div id="heatmap"></div>
    <p id="scatter-hint" class="hint">Clique sur une case pour afficher le nuage de points des deux caractéristiques.</p>
    <div id="scatter"></div>
  </main>

  <div id="tip" class="tooltip"></div>

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="js/DataLoader.js"></script>
  <script src="js/heatmap/heatmap.js"></script>
</body>
</html>
